name: Collect public repository evidence

on:
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-public-repository-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCOUNT_TRAFFIC_TOKEN: ${{ secrets.ACCOUNT_TRAFFIC_TOKEN }}
      TRACKED_OWNER: ellivien
      TRACKER_REPOSITORY: ellivien/ellivien-open-source-evidence
      MAX_REPOSITORIES: "50"
    steps:
      - name: Require the read-only traffic token
        shell: bash
        run: |
          if [[ -z "$ACCOUNT_TRAFFIC_TOKEN" ]]; then
            echo "Add ACCOUNT_TRAFFIC_TOKEN with Administration: read-only before running this workflow."
            exit 1
          fi

      - name: Check out the public evidence history
        uses: actions/checkout@v4

      - name: Capture all public repositories
        run: node scripts/collect-evidence.mjs

      - name: Commit the timestamped evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "evidence: preserve weekly GitHub snapshot"
          git push
