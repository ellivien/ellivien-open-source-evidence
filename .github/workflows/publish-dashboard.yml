name: Publish evidence dashboard

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/publish-dashboard.yml"
  workflow_run:
    workflows:
      - Collect public repository evidence
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the evidence dashboard
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publish the dashboard
        id: deployment
        uses: actions/deploy-pages@v4
